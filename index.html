<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnglishPerfect - Present Perfect Tense</title>
    <style>
        :root {
            --primary: #6C63FF;
            --secondary: #2A2D3E;
            --accent: #00D2D3;
            --bg: #F0F2F5;
            --card-bg: rgba(255, 255, 255, 0.9);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--secondary);
        }

        .app-container {
            background: var(--card-bg);
            width: 90%;
            max-width: 600px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            padding: 2rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        h1 { color: var(--primary); margin-bottom: 0.5rem; }
        p { color: #666; margin-bottom: 2rem; }

        .screen { display: none; animation: fadeIn 0.5s ease; }
        .active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        input[type="text"] {
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #ddd;
            width: 70%;
            margin-bottom: 1rem;
            font-size: 1rem;
        }

            background-color: var(--primary);
            color: white;
            border: none;

            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s, background 0.2s;
        }

        .btn:hover { background-color: #5a52d5; transform: scale(1.02); }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        
        .progress-bar {
            width: 100%;

            background: #ddd;

        .progress-fill {

</head>
<body>

<div class="app-container">
    
    <!-- START SCREEN -->
    <div id="start-screen" class="screen active">
        <h1>EnglishPerfect</h1>
        <p>Тренажер Present Perfect Tense</p>
        <p>Уровень: <span id="user-level-display" style="color: var(--primary); font-weight: bold;">Выберите уровень</span></p>
        
        <input type="text" id="level-input" placeholder="Например: A1">
        <br>
        <button class="btn" onclick="startQuiz()">Начать тестирование</button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" class="screen">
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <h2 id="question-text">Вопрос...</h2>
        
        <div class="options-grid" id="options-container">
            <!-- Options generated by JS -->
        </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result-screen" class="screen">
        <div class="score-circle" id="final-score">0%</div>
        <h2>Тест завершен!</h2>
        <p id="result-message"></p>
        
        <button class="btn btn-outline" onclick="restartQuiz()">Пройти заново</button>
        <br><br>
        <button class="btn" style="background-color: var(--secondary);" onclick="showStartScreen()">Назад к меню</button>
    </div>

</div>

<script>
    // --- DATA & LOGIC ---
    
    const levels = {
        'A1': { level: 'Beginner', questions: [
            "I haven't seen him for a long time. He is ___.", 
            "She ___ to the store yesterday. She bought some milk.", 
            "We ___ been to Paris before.", 
            "He has lost his keys."
        ]},
        'A2': { level: 'Elementary', questions: [
            "I ___ seen him since 2010.", 
            "She ___ not finished her homework yet.", 
            "They ___ been to London three times.", 
            "He has a new car."
        ]},
        'B1': { level: 'Intermediate', questions: [
            "I ___ been to Japan. I love the food there.", 
            "She ___ not finished her report yet. It is 2 AM.", 
            "We ___ been to the cinema last week.", 
            "He has lost his passport."
        ]},
        'B2': { level: 'Advanced', questions: [
            "I ___ been to Paris since 2015.", 
            "She ___ not finished her thesis yet. She is in a meeting.", 
            "They ___ been to the moon several times.", 
            "He has lost his job."
        ]},
        'C1': { level: 'Professional', questions: [
            "I ___ been to London since 2015.", 
            "She ___ not finished her thesis yet. She is in a meeting.", 
            "They ___ been to the moon several times.", 
            "He has lost his job."
        ]},
        'C2': { level: 'Native', questions: [
            "I ___ been to London since 2015.", 
            "She ___ not finished her thesis yet. She is in a meeting.", 
            "They ___ been to the moon several times.", 
            "He has lost his job."
        ]}
    };

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let userLevel = 'A1';

    // --- NAVIGATION ---

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function startQuiz() {
        const input = document.getElementById('level-input').value.trim();
        if (!input) return alert("Пожалуйста, введите уровень!");

        userLevel = input;
        currentQuestions = levels[userLevel].questions;
        currentIndex = 0;
        score = 0;
        
        document.getElementById('user-level-display').innerText = userLevel;
        showScreen('quiz-screen');
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIndex >= currentQuestions.length) {
            endQuiz();
            return;
        }

        const qText = currentQuestions[currentIndex];
        document.getElementById('question-text').innerText = qText;
        
        // Update progress bar
        const progressPercent = ((currentIndex) / currentQuestions.length) * 100;
        document.getElementById('progress').style.width = progressPercent + "%";

        const optionsDiv = document.getElementById('options-container');
        optionsDiv.innerHTML = '';

        // Generate 4 random distractors (wrong answers)
        let allOptions = [qText];
        while(allOptions.length < 4) {
            let randomQ = currentQuestions[Math.floor(Math.random() * currentQuestions.length)];
            if (!allOptions.includes(randomQ)) {
                allOptions.push(randomQ);
            }
        }

        // Shuffle options
        allOptions.sort(() => Math.random() - 0.5);

        allOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt === qText);
            optionsDiv.appendChild(btn);
        });
    }

    function checkAnswer(btn, isCorrect) {
        if (isCorrect) {
            btn.classList.add('correct');
            score++;
        } else {
            btn.classList.add('wrong');
        }
        
        // Disable all buttons after click
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);

        setTimeout(() => {
            currentIndex++;
            loadQuestion();
        }, 1500);
    }

    function endQuiz() {
        showScreen('result-screen');
        document.getElementById('final-score').innerText = Math.round((score / currentQuestions.length) * 100) + '%';
        
        let msg = "";
        if (score === currentQuestions.length) msg = "Отлично! Вы настоящий эксперт в Present Perfect.";
        else if (score > currentQuestions.length / 2) msg = "Хороший результат! У вас есть куда расти.";
        else msg = "Неплохо, но нужно повторить тему.";
        
        document.getElementById('result-message').innerText = msg;
    }

    function restartQuiz() {
        startQuiz();
    }

    function showStartScreen() {
        showScreen('start-screen');
    }

</script>

</body>
</html>
