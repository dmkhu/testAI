<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная Лампочка</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --bulb-off-color: #e0e0e0;
            --bulb-on-color: #ffbf00;
            --shadow-color: rgba(255, 191, 0, 0.6);
            --btn-text-off: #ffffff;
            --btn-text-on: #1a1a1a;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--btn-text-off);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
        }

        /* SVG Styles */
        svg {
            width: 150px;
            height: 150px;
            transition: fill 0.3s ease, filter 0.3s ease;
            display: block;
        }

        .bulb-body {
            fill: var(--bulb-off-color);
            stroke: #333;
            stroke-width: 2;
        }

        .bulb-glow {
            opacity: 0;
            transition: opacity 0.3s ease, filter 0.3s ease;
        }

        /* Glow Effect Class */
        .container.on svg .bulb-body {
            fill: var(--bulb-on-color);
            filter: drop-shadow(0 0 20px var(--shadow-color));
        }

        .container.on svg .bulb-glow {
            opacity: 1;
            filter: blur(40px);
        }

        /* Button Styles */
        button {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background-color: #333;
            color: var(--btn-text-off);
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(0,0,0,0.4);
        }

        button:active {
            transform: translateY(0);
        }

        /* Button State Classes */
        .container.on button {
            background-color: var(--bulb-on-color);
            color: var(--btn-text-on);
            box-shadow: 0 0 15px var(--shadow-color);
        }

        /* Responsive Adjustments */
        @media (max-width: 600px) {
            svg {
                width: 120px;
                height: 120px;
            }
            button {
                padding: 10px 30px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="app-container">
        <!-- SVG Bulb Representation -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <!-- Main bulb shape -->
            <path class="bulb-body" d="M12,2C7.53,2 4,5.08 4,9c0,2.69 1.08,5.06 2.76,6.76L12,22l7.24-6.24C26.08,14.06 27,11.69 27,9c0-3.92-3.53-7-8-7z"/>
            <!-- Inner filament (visual detail) -->
            <path class="bulb-body" d="M12,14l-2,-2l2,-2l2,2l-2,2z" fill="#333"/>
            <!-- Glow effect overlay -->
            <circle class="bulb-glow" cx="12" cy="16" r="8" fill="#ffbf00" opacity="0.4"/>
        </svg>

        <button id="toggle-btn">ВКЛЮЧИТЬ</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('app-container');
            const button = document.getElementById('toggle-btn');

            // Load state from localStorage or default to false (off)
            const isOn = localStorage.getItem('bulbState') === 'true';
            
            if (isOn) {
                container.classList.add('on');
                button.textContent = 'ВЫКЛЮЧИТЬ';
            }

            // Toggle Logic
            button.addEventListener('click', () => {
                const newState = !container.classList.contains('on');
                
                // Update UI classes
                if (newState) {
                    container.classList.add('on');
                    button.textContent = 'ВЫКЛЮЧИТЬ';
                } else {
                    container.classList.remove('on');
                    button.textContent = 'ВКЛЮЧИТЬ';
                }

                // Save to localStorage
                localStorage.setItem('bulbState', newState);
            });
        });
    </script>
</body>
</html>
