<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная Лампочка</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --bulb-off-color: #333333;
            --bulb-on-color: #f8f8f8;
            --shadow-glow: rgba(255, 255, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        main {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .bulb-container {
            width: 200px;
            height: 200px;
            margin: 0 auto 40px;
            border-radius: 50%;
            background-color: var(--bulb-off-color);
            box-shadow: inset 0 10px 20px rgba(0, 0, 0, 0.5), 0 0 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bulb-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .bulb-container.on {
            background-color: var(--bulb-on-color);
            box-shadow: inset 0 10px 20px rgba(0, 0, 0, 0.5), 0 0 60px var(--shadow-glow), 0 0 100px var(--shadow-glow);
        }

        .bulb-container.on::before {
            opacity: 1;
            animation: flicker 2s infinite alternate;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        button {
            background-color: transparent;
            border: 2px solid var(--text-color);
            color: var(--text-color);
            font-size: 1.2rem;
            padding: 15px 40px;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s;
            min-width: 48px;
            min-height: 48px;
        }

        button:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        button:active {
            transform: scale(0.95);
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        /* Адаптивность для мобильных */
        @media (max-width: 600px) {
            .bulb-container {
                width: 150px;
                height: 150px;
            }
            h1 {
                font-size: 1.2rem;
            }
            button {
                padding: 12px 30px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="bulb-container" id="bulb"></div>
        <h1>Интерактивная Лампочка</h1>
        <button id="toggle-btn">Включить</button>
    </main>

    <script>
        (function() {
            const bulb = document.getElementById('bulb');
            const btn = document.getElementById('toggle-btn');
            
            // Логика переключения состояния
            function toggleState() {
                if (bulb.classList.contains('on')) {
                    bulb.classList.remove('on');
                    btn.textContent = 'Включить';
                } else {
                    bulb.classList.add('on');
                    btn.textContent = 'Выключить';
                }
            }

            // Обработка событий мыши и тача
            const handleInteraction = (e) => {
                e.preventDefault();
                toggleState();
            };

            btn.addEventListener('click', handleInteraction);
            
            // Поддержка тач-событий для мобильных устройств
            btn.addEventListener('touchstart', handleInteraction, { passive: true });
        })();
    </script>
</body>
</html>
