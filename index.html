<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CipherGen - Secure Password Generator</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --accent-blue: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #e5e7eb;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.025em;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        label {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        input[type="number"] {
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            width: 120px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        button {
            padding: 0.75rem 1.5rem;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .output-section {
            margin-top: 2rem;
            text-align: center;
        }

        .output-container {
            background-color: #f9fafb;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            position: relative;
        }

        .password-display {
            font-family: var(--font-mono);
            font-size: 1.25rem;
            color: var(--text-primary);
            white-space: pre;
            overflow-x: auto;
            min-height: 3rem;
            display: flex;
            align-items: center;
        }

        .copy-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            margin-left: 1rem;
        }

        .copy-btn:hover {
            background-color: #f3f4f6;
            color: var(--text-primary);
            transform: none;
        }

        .error-message {
            display: none;
            color: #ef4444;
            font-size: 0.9rem;
            margin-top: 1rem;
            text-align: center;
        }

        @media (max-width: 600px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            input[type="number"] {
                width: 100%;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>CipherGen</h1>
        <div class="subtitle">Secure Alphanumeric Password Generator (No-Symbol Edition)</div>
    </header>

    <main>
        <section class="controls">
            <label for="passwordCount" style="margin-right: 0.5rem;">Quantity:</label>
            <input type="number" id="passwordCount" min="1" value="1" placeholder="Enter count">
            
            <button id="generateBtn">Generate</button>
        </section>

        <div id="errorMessage" class="error-message">
            Please enter a valid positive integer.
        </div>

        <section class="output-section">
            <div class="output-container">
                <div id="passwordOutput" class="password-display"></div>
                <button id="copyBtn" class="copy-btn">Copy to Clipboard</button>
            </div>
        </section>
    </main>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const countInput = document.getElementById('passwordCount');
        const outputDiv = document.getElementById('passwordOutput');
        const errorMsg = document.getElementById('errorMessage');

        // Character Set: [a-z] + [A-Z] + [2-9]
        // Explicitly excludes 0, O, 1, l, ! as per spec
        const CHAR_SET = "23456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";

        /**
         * Generates a single random string of specified length using crypto.getRandomValues
         */
        function generateSecureString(length) {
            // Fix 1: Check for MAX_SAFE_INTEGER to prevent RangeError
            if (length > Number.MAX_SAFE_INTEGER || length < 0) return '';

            const array = new Uint32Array(length);
            
            // Fix 2: Polyfill for crypto.getRandomValues for older browsers
            if (!window.crypto && !window.crypto.subtle) {
                window.crypto = { getRandomValues: (array) => {
                    let bytes = new Uint8Array(array.length);
                    window.crypto.randomFillSync(bytes);
                    array.set(bytes, 0);
                }};
            }

            try {
                window.crypto.getRandomValues(array);
                
                let result = '';
                for (let i = 0; i < length; i++) {
                    // Fix 3: Use modulo to map Uint32 values to CHAR_SET indices
                    // This is efficient enough for typical use cases compared to string concatenation overhead
                    result += CHAR_SET[array[i] % CHAR_SET.length];
                }
                return result;
            } catch (e) {
                console.error("Error generating secure string:", e);
                return '';
            }
        }

        /**
         * Generates N passwords and concatenates them into a single line
         */
        function generateBulk(count) {
            // Fix 4: Use Array.from with join to avoid string concatenation overhead in loops
            const parts = [];
            for (let i = 0; i < count; i++) {
                if (i > 0) {
                    parts.push(' '); // Separator as per spec
                }
                parts.push(generateSecureString(10));
            }
            return parts.join('');
        }

        /**
         * Handles the generation logic and UI updates
         */
        function handleGenerate() {
            const rawValue = countInput.value;
            
            // Fix 7: Explicit check for empty string before parsing
            if (!rawValue.trim()) {
                errorMsg.textContent = "Please enter a valid positive integer.";
                errorMsg.style.display = 'block';
                outputDiv.textContent = '';
                return;
            }

            const count = parseInt(rawValue, 10);

            // Fix 6: Simplified validation logic
            if (isNaN(count) || !Number.isFinite(count) || count <= 0) {
                errorMsg.style.display = 'block';
                outputDiv.textContent = '';
                return;
            }

            errorMsg.style.display = 'none';
            
            const result = generateBulk(count);
            outputDiv.textContent = result;
        }

        /**
         * Handles the copy to clipboard functionality
         */
        async function handleCopy() {
            const text = outputDiv.textContent;
            if (!text) return;

            try {
                await navigator.clipboard.writeText(text);
                // Visual feedback for success (optional, but good UX)
                const originalText = copyBtn.textContent;
                copyBtn.textContent = "Copied!";
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 1500);
            } catch (err) {
                console.error('Could not copy text: ', err);
                // Fallback for older browsers or permission denied
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand("copy");
                document.body.removeChild(textArea);
            }
        }

        // Event Listeners
        generateBtn.addEventListener('click', handleGenerate);
        copyBtn.addEventListener('click', handleCopy);
    });
</script>
</body>
</html>
