<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добрые пожелания</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        button {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(255, 105, 180, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        button:hover {
            background-color: #ff1493;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        #message-container {
            visibility: hidden;
            opacity: 0;
            transition: all 0.8s ease-out;
        }

        button.active-message {
            display: block;
        }

        .potion-text {
            font-size: 2rem;
            color: #d63384;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <button id="wishBtn" onclick="showWish()">Нажми меня</button>
        <div id="message-container">
            <p id="wishText" class="potion-text"></p>
        </div>
    </div>

    <script>
        const wishes = [
            "Желаю тебе вдохновения и невероятного успеха!",
            "Пусть каждый день приносит только радость и уют.",
            "Счастья, любви и ярких моментов на всю жизнь.",
            "Твои мечты сбываются быстрее, чем ты успеваешь их придумать!",
            "Дай себе силы, чтобы быть самой лучшей версией себя!",
            "Пусть удаля всегда будет рядом с тобой.",
            "Светит тебе солнце и улыбнется судьба.",
            "Живи ярко, дыши глубоко и люби каждый момент."
        ];

        function getRandomWish() {
            const randomIndex = Math.floor(Math.random() * wishes.length);
            return wishes[randomIndex];
        }

        function showWish() {
            const btn = document.getElementById('wishBtn');
            const container = document.getElementById('message-container');
            const text = document.getElementById('wishText');

            btn.classList.remove('active-message');
            
            container.style.visibility = 'visible';
            
            setTimeout(() => {
                text.innerText = getRandomWish();
            }, 100);

            container.style.opacity = '0';
            
            setTimeout(() => {
                container.style.visibility = 'hidden';
                container.style.opacity = '0';
                container.style.transitionDelay = '0.2s';
                
                setTimeout(() => {
                    btn.classList.add('active-message');
                }, 800);
            }, 500);
        }
    </script>
</body>
</html>
