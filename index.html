<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Змейка JS</title>
    <style>
        body {
            background-color: #202124;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        canvas {
            border: 2px solid #fff;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .score {
            font-size: 24px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="score">Счет: <span id="scoreVal">0</span></div>
<canvas id="gameCanvas" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("scoreVal");

const gridSize = 20;
const tileCount = canvas.width / gridSize;
let score = 0;

let velocityX = 0;
let velocityY = 0;
let snake = [];
let apple = { x: 5, y: 5 };
let gameInterval;

function initGame() {
    snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
    ];
    velocityX = 1;
    velocityY = 0;
    score = 0;
    scoreEl.innerText = score;
    placeApple();
}

function placeApple() {
    apple.x = Math.floor(Math.random() * tileCount);
    apple.y = Math.floor(Math.random() * tileCount);
    
    // Проверка, чтобы яблоко не появилось внутри змейки
    for (let part of snake) {
        if (part.x === apple.x && part.y === apple.y) {
            placeApple();
        }
    }
}

function draw() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Рисуем змейку
    for (let i = 0; i < snake.length; i++) {
        if (i === 0) ctx.fillStyle = "#4caf50"; // Голова ярче
        else ctx.fillStyle = "#81c784"; // Тело светлее
        ctx.fillRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize - 2, gridSize - 2);
    }

    // Рисуем яблоко
    ctx.fillStyle = "#ff5252";
    ctx.fillRect(apple.x * gridSize, apple.y * gridSize, gridSize - 2, gridSize - 2);

    // Логика движения
    const head = { x: snake[0].x + velocityX, y: snake[0].y + velocityY };

    // Проверка столкновений со стенами
    if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        clearInterval(gameInterval);
        return;
    }

    // Проверка столкновений с хвостом
    for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
            clearInterval(gameInterval);
            return;
        }
    }

    snake.unshift(head);

    // Проверка еды
    if (head.x === apple.x && head.y === apple.y) {
        score++;
        scoreEl.innerText = score;
        placeApple();
    } else {
        snake.pop();
    }

    // Очистка экрана
    ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function gameLoop() {
    draw();
    if (velocityX !== 0 || velocityY !== 0) {
        setTimeout(() => {
            initGame();
            gameInterval = setInterval(gameLoop, 1000 / 15); // Скорость игры
        }, 10);
    }
}

document.addEventListener("keydown", keyDownEvent);
function keyDownEvent(e) {
    switch (e.keyCode) {
        case 37: // Влево
            if (velocityX === 1) return;
            velocityX = -1;
            velocityY = 0;
            break;
        case 38: // Вверх
            if (velocityY === 1) return;
            velocityX = 0;
            velocityY = -1;
            break;
        case 39: // Вправо
            if (velocityX === -1) return;
            velocityX = 1;
            velocityY = 0;
            break;
        case 40: // Вниз
            if (velocityY === -1) return;
            velocityX = 0;
            velocityY = 1;
            break;
    }
}

initGame();
gameLoop();

</script>
</body>
</html>
