<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная Лампочка</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
            --bulb-off: #333;
            --bulb-on: #ffeb3b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        main {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .bulb-container {
            width: 200px;
            height: 200px;
            margin: 0 auto 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bulb {
            width: 150px;
            height: 150px;
            background-color: var(--bulb-off);
            border-radius: 50%;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease-in-out;
        }

        .bulb.on {
            background-color: var(--bulb-on);
            box-shadow: 
                inset 0 0 20px rgba(0, 0, 0, 0.5),
                0 0 100px var(--bulb-on),
                0 0 200px var(--bulb-on);
            animation: glow-pulse 1.5s infinite alternate;
        }

        @keyframes glow-pulse {
            0% {
                box-shadow: 
                    inset 0 0 20px rgba(0, 0, 0, 0.5),
                    0 0 60px var(--bulb-on),
                    0 0 120px var(--bulb-on);
            }
            100% {
                box-shadow: 
                    inset 0 0 20px rgba(0, 0, 0, 0.5),
                    0 0 120px var(--bulb-on),
                    0 0 240px var(--bulb-on);
            }
        }

        .switch-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        button.switch-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.3s;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        button.switch-btn:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        button.switch-btn:active {
            transform: scale(0.95);
        }

        .status-text {
            margin-top: 30px;
            font-size: 1.2rem;
            opacity: 0.7;
            letter-spacing: 1px;
        }

        /* Адаптивность для мобильных */
        @media (max-width: 600px) {
            .bulb-container {
                width: 150px;
                height: 150px;
                margin-bottom: 20px;
            }
            .bulb {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>

    <main>
        <div class="bulb-container">
            <div class="bulb" id="bulb"></div>
        </div>

        <div class="switch-container">
            <button class="switch-btn" id="toggleBtn" aria-label="Переключить свет"></button>
        </div>

        <div class="status-text" id="statusText">Ожидание...</div>
    </main>

    <script type="module">
        const bulb = document.getElementById('bulb');
        const btn = document.getElementById('toggleBtn');
        const statusText = document.getElementById('statusText');

        // Инициализация состояния
        let isOn = false;

        function updateStatus() {
            if (isOn) {
                statusText.textContent = "Свет включен";
                statusText.style.color = "#ffeb3b";
            } else {
                statusText.textContent = "Свет выключен";
                statusText.style.color = "#ffffff";
            }
        }

        function toggleLight() {
            if (!isOn) {
                // Включение: случайная задержка 0.5s - 1.5s
                const randomDelay = Math.random() * (1.5 - 0.5) + 0.5;
                
                setTimeout(() => {
                    isOn = true;
                    bulb.classList.add('on');
                    updateStatus();
                }, randomDelay * 1000);
            } else {
                // Выключение: мгновенное
                isOn = false;
                bulb.classList.remove('on');
                updateStatus();
            }
        }

        // Обработчики событий
        btn.addEventListener('click', toggleLight);
        
        // Поддержка клавиш (Пробел или Enter)
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Enter') {
                toggleLight();
            }
        });

        // Инициализация при загрузке
        updateStatus();
    </script>
</body>
</html>
