<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Password Generator</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --accent-color: #007bff;
            --accent-hover: #0056b3;
            --error-color: #dc3545;
            --border-radius: 8px;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 600px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--text-primary);
            font-weight: 700;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        input[type="number"] {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            font-size: 1rem;
            width: 100%;
            transition: border-color 0.3s ease;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button.generate-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        button.generate-btn:hover {
            background-color: var(--accent-hover);
        }

        button.generate-btn:active {
            transform: scale(0.98);
        }

        .output-section {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 15px;
            background-color: #fafafa;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            resize: vertical;
            line-height: 1.5;
        }

        textarea:focus {
            outline: none;
        }

        .copy-btn-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        button.copy-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button.copy-btn:hover {
            background-color: #218838;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            color: white;
            padding: 10px 20px;
            border-radius: var(--border-radius);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
        }

        .error-message {
            color: var(--error-color);
            font-size: 0.9rem;
            margin-top: 5px;
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            textarea {
                height: 180px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Secure Password Generator</h1>
    </header>

    <div class="input-group">
        <label for="passwordCount">Number of Passwords</label>
        <input type="number" id="passwordCount" placeholder="e.g. 5" min="1">
        <div class="error-message" id="errorMessage">Please enter at least one password.</div>
    </div>

    <button class="generate-btn" onclick="generatePasswords()">Generate</button>

    <div class="output-section">
        <textarea id="passwordOutput" readonly placeholder="Generated passwords will appear here..."></textarea>
        <div class="copy-btn-container">
            <button class="copy-btn" onclick="copyToClipboard()">Copy All</button>
        </div>
    </div>
</div>

<div class="toast" id="toastNotification">Copied to clipboard!</div>

<script>
    // Configuration based on Technical Specification
    const CHARACTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    const EXCLUDED_CHARS = new Set(['0', 'O', '1', 'l', '!']);
    
    // DOM Elements
    const inputField = document.getElementById('passwordCount');
    const outputArea = document.getElementById('passwordOutput');
    const errorMessage = document.getElementById('errorMessage');
    const toast = document.getElementById('toastNotification');

    /**
     * Generates a single random password of length 10.
     * Implements exclusion logic for specific characters using Fisher-Yates shuffle.
     */
    function generateSinglePassword() {
        let pool = CHARACTERS.split('').sort(() => 0.5 - Math.random());
        
        // Filter out excluded characters from the shuffled pool
        pool = pool.filter(char => !EXCLUDED_CHARS.has(char));

        if (pool.length === 0) {
            console.error("No valid characters left in pool");
            return "";
        }

        let password = '';
        for (let i = 0; i < 10; i++) {
            // Randomly select a character from the filtered pool
            const randomIndex = Math.floor(Math.random() * pool.length);
            password += pool[randomIndex];
        }

        return password;
    }

    /**
     * Main generation logic.
     */
    function generatePasswords() {
        // Validation Logic
        const countValue = inputField.value.trim();
        
        if (!countValue || parseInt(countValue) <= 0) {
            errorMessage.style.display = 'block';
            outputArea.value = '';
            return;
        }

        errorMessage.style.display = 'none';

        // Generate Logic
        const count = parseInt(countValue);
        const generatedPasswords = [];

        for (let i = 0; i < count; i++) {
            generatedPasswords.push(generateSinglePassword());
        }

        // Output Display
        outputArea.value = generatedPasswords.join('\n');
    }

    /**
     * Copies the content of the textarea to the clipboard.
     */
    function copyToClipboard() {
        const text = outputArea.value;
        
        if (!text) return;

        // Check for modern browser support first
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                showToast();
            }).catch(err => {
                console.error('Failed to copy text: ', err);
                showToast();
            });
        } else {
            // Fallback for older browsers (IE/old Safari)
            const textarea = document.getElementById('passwordOutput');
            textarea.select();
            try {
                document.execCommand("copy");
                showToast();
            } catch (err) {
                console.error('Fallback copy failed: ', err);
                // Only show toast if we actually reached here, or just log the error
                showToast(); 
            }
        }
    }

    /**
     * Displays a toast notification.
     */
    function showToast() {
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }
</script>

</body>
</html>
