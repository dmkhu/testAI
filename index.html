<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Light Bulb MVP</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --bulb-off: #ffffff;
            --bulb-on: #ffaa00;
            --btn-off: #333;
            --btn-on: #4caf50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            padding: 20px;
        }

        /* --- Лампочка (CSS Art) --- */
        .bulb-wrapper {
            position: relative;
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Винт (Винт) */
        .screw {
            position: absolute;
            top: 0;
            width: 60px;
            height: 60px;
            background-color: var(--bulb-off);
            border-radius: 50%;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        /* Лопатка (Корпус) */
        .base {
            position: absolute;
            bottom: 0;
            width: 100px;
            height: 80px;
            background-color: #2c3e50;
            border-radius: 40% 60% 70% 30%;
            z-index: 1;
        }

        /* Стекло (Свет) */
        .glass {
            position: absolute;
            top: 20px;
            width: 80px;
            height: 80px;
            background-color: var(--bulb-off);
            border-radius: 50%;
            z-index: 2;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        /* Линии на стекле для реализма */
        .glass::before {
            content: '';
            position: absolute;
            top: 25%;
            left: 25%;
            width: 50%;
            height: 50%;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* Анимация вращения */
        .screw {
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        /* Эффект свечения при включении */
        .bulb-wrapper.light-on .screw,
        .bulb-wrapper.light-on .glass {
            background-color: var(--bulb-on);
            box-shadow: 0 0 40px var(--bulb-on), inset 0 0 20px var(--bulb-on);
        }

        /* --- Панель управления --- */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .toggle-btn {
            width: 80px;
            height: 40px;
            background-color: var(--btn-off);
            border-radius: 20px;
            cursor: pointer;
            position: relative;
            transition: background-color 0.3s ease;
            border: none;
        }

        .toggle-btn::after {
            content: '';
            position: absolute;
            right: 5px;
            top: 5px;
            width: 28px;
            height: 28px;
            background-color: #fff;
            border-radius: 50%;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .toggle-btn.active {
            background-color: var(--btn-on);
        }

        .toggle-btn.active::after {
            transform: translateX(28px);
        }

        .brightness-slider {
            width: 100%;
            max-width: 300px;
            height: 6px;
            background-color: #444;
            border-radius: 5px;
            -webkit-appearance: none;
            cursor: pointer;
        }

        .brightness-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background-color: #fff;
            border-radius: 50%;
            cursor: pointer;
        }

        .brightness-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background-color: #fff;
            border-radius: 50%;
            cursor: pointer;
        }

        /* Адаптивность */
        @media (max-width: 600px) {
            .container {
                gap: 1rem;
            }
            .bulb-wrapper {
                width: 120px;
                height: 120px;
            }
            .screw {
                width: 50px;
                height: 50px;
            }
            .base {
                width: 80px;
                height: 60px;
            }
            .glass {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>

    <main class="container">
        <!-- Лампочка -->
        <div class="bulb-wrapper" id="bulbWrapper">
            <div class="screw"></div>
            <div class="base"></div>
            <div class="glass"></div>
        </div>

        <!-- Панель управления -->
        <div class="controls">
            <button class="toggle-btn" id="powerBtn" aria-label="Вкл/Выкл лампочку"></button>
            
            <!-- Слайдер яркости (работает только при включении) -->
            <input type="range" class="brightness-slider" id="brightnessSlider" min="0" max="100" value="50">
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const bulbWrapper = document.getElementById('bulbWrapper');
            const powerBtn = document.getElementById('powerBtn');
            const brightnessSlider = document.getElementById('brightnessSlider');
            
            let isOn = false;
            let spinInterval = null;

            // Логика кнопки ВКЛ/ВЫКЛ
            powerBtn.addEventListener('click', () => {
                if (!isOn) {
                    // Включение
                    isOn = true;
                    bulbWrapper.classList.add('light-on');
                    powerBtn.classList.add('active');
                    
                    // Запуск вращения (быстрое)
                    spinInterval = setInterval(() => {
                        const currentRotation = parseFloat(bulbWrapper.style.transform);
                        if (!isNaN(currentRotation)) {
                            bulbWrapper.style.transform = `rotateY(${currentRotation + 10}deg)`;
                        } else {
                            bulbWrapper.style.transform = 'rotateY(360deg)';
                        }
                    }, 50); // Быстрая частота для имитации вращения

                } else {
                    // Выключение (остановка)
                    isOn = false;
                    bulbWrapper.classList.remove('light-on');
                    powerBtn.classList.remove('active');
                    
                    // Остановка вращения через CSS transition
                    bulbWrapper.style.transition = 'transform 0.5s ease-in';
                    bulbWrapper.style.transform = 'rotateY(0deg)';
                }
            });

            // Логика слайдера яркости
            brightnessSlider.addEventListener('input', (e) => {
                if (!isOn) return;

                const value = e.target.value;
                
                // Устанавливаем прозрачность для имитации яркости
                const glass = document.querySelector('.glass');
                const screw = document.querySelector('.screw');
                
                // Если значение 0, выключаем визуально (через класс)
                if (value === 0) {
                    bulbWrapper.classList.remove('light-on');
                    powerBtn.classList.remove('active');
                    isOn = false;
                    return;
                }

                // Вычисляем процент прозрачности (1 - value/100)
                const opacity = 1 - (value / 100);
                
                glass.style.opacity = opacity;
                screw.style.opacity = opacity;
            });
        });
    </script>
</body>
</html>
