<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Light Bulb UI</title>
    <style>
        :root {
            --bg-color: #2b2b2b;
            --bulb-off-color: #555;
            --bulb-on-color: #f7df5e;
            --text-color: #ffffff;
            --btn-bg: #444;
            --glow-color: rgba(247, 223, 94, 0.6);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .main-container {
            text-align: center;
            padding: 2rem;
        }

        .light-bulb-wrapper {
            position: relative;
            width: 150px;
            height: 220px;
            margin: 0 auto 30px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.175);
        }

        .light-bulb-icon {
            width: 100%;
            height: 100%;
            background-color: var(--bulb-off-color);
            border-radius: 50% 50% 40% 40%;
            box-shadow: inset 10px 10px 30px rgba(0, 0, 0, 0.8);
            position: relative;
            z-index: 2;
        }

        .light-bulb-icon::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 40px;
            background-color: var(--bulb-off-color);
            border-radius: 50%;
            z-index: 3;
        }

        .light-bulb-text {
            font-size: 1.2rem;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .control-btn {
            padding: 15px 40px;
            font-size: 1.1rem;
            background-color: var(--btn-bg);
            color: var(--text-color);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .control-btn:hover {
            background-color: #555;
            transform: translateY(-2px);
        }

        .control-btn:active {
            transform: translateY(1px);
        }

        /* Состояния */
        body.light-on .light-bulb-wrapper {
            transform: scale(1.1);
        }

        body.light-on .light-bulb-icon {
            background-color: var(--bulb-on-color);
            box-shadow: 
                0 0 30px var(--glow-color),
                inset 0 0 15px rgba(255, 255, 255, 0.8);
        }

        body.light-on .light-bulb-text {
            opacity: 0;
        }

        body.light-on .control-btn {
            background-color: var(--bulb-on-color);
            color: #2b2b2b;
            box-shadow: 0 0 15px var(--glow-color);
        }

        /* Анимация света */
        @keyframes flicker {
            0% { opacity: 1; }
            50% { opacity: 0.9; }
            100% { opacity: 1; }
        }

        body.light-on .light-bulb-icon::before {
            animation: flicker 2s infinite ease-in-out;
        }
    </style>
</head>
<body>

<main class="main-container">
    <div id="bulb-wrapper" class="light-bulb-wrapper">
        <div class="light-bulb-icon"></div>
    </div>
    <button id="toggleBtn" class="control-btn">ВКЛ / ВЫКЛ</button>
</main>

<script>
    // Состояние системы
    const state = {
        isLightOn: false,
        lastActionTime: null
    };

    // Элементы DOM
    const bodyElement = document.body;
    const btnElement = document.getElementById('toggleBtn');
    const bulbWrapper = document.getElementById('bulb-wrapper');
    const textElement = document.querySelector('.light-bulb-text');

    // Аудио контекст (синтезатор звука)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        try {
            if (state.isLightOn) return; // Если уже включено, не издаем звук выключения
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'power-on') {
                // Звук ВКЛ: высокий пик, быстрый спад (тихий звук)
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'power-off') {
                // Звук ВЫКЛ: резкий звук отключения (похож на "клань")
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.6);
            }
        } catch (e) {
            console.warn('Audio context not available or user interaction required first');
        }
    }

    function updateUI() {
        if (state.isLightOn) {
            bodyElement.classList.add('light-on');
            textElement.textContent = "Включена";
            textElement.style.opacity = 1;
            btnElement.textContent = "ВЫКЛ";
        } else {
            bodyElement.classList.remove('light-on');
            textElement.textContent = "Выключена";
            textElement.style.opacity = 0.7;
            btnElement.textContent = "ВКЛ";
        }
    }

    function toggleLight() {
        const now = Date.now();
        
        // Проверка на спам (опционально, можно убрать)
        if (!state.lastActionTime || (now - state.lastActionTime) < 500) return;

        // Логика переключения
        state.isLightOn = !state.isLightOn;
        state.lastActionTime = now;
        
        playSound(state.isLightOn ? 'power-on' : 'power-off');
        updateUI();
    }

    // Обработчики событий
    btnElement.addEventListener('click', toggleLight);
    
    // Поддержка свайпов на мобильных (простая реализация)
    let touchStartY = 0;
    document.body.addEventListener('touchstart', e => touchStartY = e.touches[0].clientY);
    document.body.addEventListener('touchend', e => {
        if (touchStartY !== undefined && Math.abs(e.changedTouches[0].clientY - touchStartY) > 50) {
            toggleLight();
        }
        touchStartY = null;
    });

</script>
</body>
</html>
